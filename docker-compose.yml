version: "3.9"

services:
  db:
    image: postgres:15
    container_name: palantir_db
    restart: always
    environment:
      POSTGRES_DB: palantir
      POSTGRES_USER: palantir
      POSTGRES_PASSWORD: palantir
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: palantir_app
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db

    # ✅ VERY IMPORTANT (this fixes your issue)
    env_file:
      - .env

    # ✅ Ensures DB is reachable via service name "db"
    environment:
      DATABASE_URL: postgresql://palantir:palantir@db:5432/palantir

volumes:
  postgres_data: